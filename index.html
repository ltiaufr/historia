<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="História — acervo público de fotografias e memórias"><title>História | Acervo fotográfico</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#24323c;background:#f5f6f3}*{box-sizing:border-box}body{margin:0}header{background:#182b32;color:white;padding:32px max(20px,calc((100vw - 1100px)/2))}h1{font-family:Georgia,serif;font-size:clamp(2.3rem,5vw,4rem);margin:0 0 8px}header p{opacity:.83;margin:0}main{max-width:1100px;margin:auto;padding:25px 20px}label{display:block;font-weight:600;margin:0 0 8px}.search{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;padding:12px;border:1px solid #c8cfcc;border-radius:8px}input{flex:1;min-width:200px}button,.link{cursor:pointer;background:#234a54;color:white;border:0;text-decoration:none;padding:12px 18px;border-radius:8px;display:inline-block}.link.secondary{background:#e5ebe8;color:#234a54}.meta{margin:22px 0;color:#53636b}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}.item{border:1px solid #dbe0dc;border-radius:12px;overflow:hidden;background:white}.item img{display:block;width:100%;height:190px;object-fit:cover;background:#e7e9e5}.item .content{padding:14px}.item h2{font-size:1.05rem;margin:0 0 7px}.item p{margin:5px 0;color:#53636b;font-size:.9rem}.item button{padding:8px 12px;margin-top:10px}dialog{border:0;border-radius:12px;max-width:min(800px,94vw);width:100%;padding:16px}dialog::backdrop{background:#000b}dialog img{max-width:100%;max-height:65vh;display:block;margin:10px auto}dialog menu{display:flex;justify-content:flex-end;padding:0;margin:0}footer{padding:24px;text-align:center;color:#68767a}a{color:inherit}#empty{padding:30px;background:white;border-radius:10px}nav{margin-top:15px}nav a{color:white}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #d69c37;outline-offset:2px}
</style></head><body>
<header><h1>História</h1><p>Fotografias, lugares e memórias para compartilhar.</p><nav><a href="./admin/">Cadastrar fotografia (acesso restrito)</a></nav></header>
<main><label for="q">Pesquisar no acervo</label><div class="search"><input id="q" type="search" placeholder="Título, local, ano, descrição ou palavra-chave" autocomplete="off"><button id="clear" type="button">Limpar</button></div><p class="meta" id="count" role="status">Carregando acervo…</p><section id="grid" class="grid" aria-label="Fotografias"></section><p id="empty" hidden>Nenhuma fotografia encontrada. Tente outros termos.</p></main>
<dialog id="viewer" aria-label="Detalhes da fotografia"><menu><button id="close" type="button">Fechar</button></menu><h2 id="detail-title"></h2><img id="detail-image" alt=""><p id="detail-description"></p><p id="detail-meta"></p><p id="detail-tags"></p><a id="detail-original" class="link" target="_blank" rel="noopener noreferrer" hidden>Abrir fotografia original</a></dialog><footer>Projeto História · Acervo experimental</footer>
<script>
"use strict";
const grid=document.getElementById('grid'),search=document.getElementById('q'),count=document.getElementById('count'),empty=document.getElementById('empty'),dialog=document.getElementById('viewer');
let photos=[];
const clean=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function safeUrl(raw){try{const url=new URL(String(raw),location.href);return ['https:','http:'].includes(url.protocol)?url.href:null}catch{return null}}
function showPhoto(p){document.getElementById('detail-title').textContent=p.titulo||'Sem título';const img=document.getElementById('detail-image');img.src=safeUrl(p.miniatura)||'';img.alt=p.descricao||p.titulo||'Fotografia';document.getElementById('detail-description').textContent=p.descricao||'';document.getElementById('detail-meta').textContent=[p.local,p.ano,p.fonte||p.autor].filter(Boolean).join(' · ');document.getElementById('detail-tags').textContent=(p.palavras_chave||[]).join(' · ');const a=document.getElementById('detail-original'),href=safeUrl(p.original);a.hidden=!href;if(href)a.href=href;dialog.showModal()}
function render(){
  grid.replaceChildren();
  const term=clean(search.value.trim());
  const searching=term.length>0;
  // Na abertura, mostrar somente as quatro últimas fotografias com miniaturas.
  // Sem termo de busca, registros sem data ou miniatura não ocupam a vitrine.
  const recentes=photos
    .filter(p=>safeUrl(p.miniatura))
    .sort((a,b)=>(Date.parse(b.criado_em)||0)-(Date.parse(a.criado_em)||0))
    .slice(0,4);
  // A pesquisa continua considerando todo o catálogo, sem limitar a quatro.
  const matches=searching
    ?photos.filter(p=>clean([p.titulo,p.descricao,p.local,p.ano,p.autor,p.fonte,...(Array.isArray(p.palavras_chave)?p.palavras_chave:[])].join(' ')).includes(term))
    :recentes;
  for(const p of matches){
    const article=document.createElement('article');article.className='item';
    const img=document.createElement('img');img.loading='lazy';img.alt=p.descricao||p.titulo||'Fotografia';img.src=safeUrl(p.miniatura)||'';
    const body=document.createElement('div');body.className='content';
    const h=document.createElement('h2');h.textContent=p.titulo||'Sem título';
    const info=document.createElement('p');info.textContent=[p.local,p.ano].filter(Boolean).join(' · ');
    const btn=document.createElement('button');btn.type='button';btn.textContent='Ver detalhes';
    btn.addEventListener('click',()=>showPhoto(p));
    body.append(h,info,btn);article.append(img,body);grid.append(article);
  }
  count.textContent=searching
    ?matches.length+' fotografia(s) encontrada(s)'
    :'Últimas '+matches.length+' fotografia(s) publicadas · '+photos.filter(p=>safeUrl(p.miniatura)).length+' no acervo';
  empty.hidden=matches.length>0;
  empty.textContent=searching
    ?'Nenhuma fotografia encontrada. Tente outros termos.'
    :'Ainda não há fotografias publicadas.';
}
search.addEventListener('input',render);document.getElementById('clear').addEventListener('click',()=>{search.value='';render();search.focus()});document.getElementById('close').addEventListener('click',()=>dialog.close());
fetch('./dados/acervo.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Falha '+r.status);return r.json()}).then(d=>{photos=Array.isArray(d)?d:[];render()}).catch(()=>{count.textContent='Não foi possível carregar o acervo.';empty.hidden=false;empty.textContent='Verifique o arquivo dados/acervo.json.'});
</script></body></html>
