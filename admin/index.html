<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>História · Cadastro experimental</title>
<style>body{font:16px system-ui,sans-serif;max-width:800px;margin:0 auto;padding:24px;background:#f6f7f4;color:#24343b}h1{font-family:Georgia,serif}form{background:white;padding:24px;border-radius:12px;display:grid;gap:14px}label{display:grid;gap:6px;font-weight:600}input,textarea,button{font:inherit;padding:10px;border:1px solid #b7c5c1;border-radius:7px}textarea{min-height:90px}button{background:#214852;color:#fff;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}small,.warning{color:#5b676c}.warning{padding:12px;background:#fff1d5;border-radius:8px}#result{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#214852}.actions{display:flex;gap:10px;flex-wrap:wrap}.secondary{background:#dce5e3;color:#214852}li{margin:8px 0}</style></head><body>
<p><a href="../">← Voltar à galeria</a></p><h1>Cadastro de fotografias</h1>
<p class="warning"><strong>Cadastro experimental, ainda sem autenticação.</strong> Os dados são armazenados apenas neste navegador e não são enviados ao GitHub nem ao Google Drive. Não informe dados privados ou utilize este formulário para cadastros definitivos.</p>
<form id="form"><label>Título *<input name="titulo" required maxlength="150"></label><label>Descrição<textarea name="descricao" maxlength="1500"></textarea></label><label>Ano ou data<input name="ano" maxlength="60" placeholder="Ex.: 1985 ou década de 1970"></label><label>Fonte<input name="fonte" maxlength="200" placeholder="Ex.: acervo da família, arquivo municipal"></label><button type="submit">Salvar cadastro experimental</button></form>
<p id="status" role="status" aria-live="polite"></p>
<script>
"use strict";
const KEY='historia-cadastros-v1';
const form=document.getElementById('form'),status=document.getElementById('status');
function readDrafts(){try{const items=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(items)?items:[]}catch{return []}}
function saveDrafts(items){try{localStorage.setItem(KEY,JSON.stringify(items));return true}catch{return false}}
form.addEventListener('submit',e=>{
 e.preventDefault();
 const d=new FormData(form);
 const p={id:'foto-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),titulo:String(d.get('titulo')).trim(),descricao:String(d.get('descricao')).trim(),ano:String(d.get('ano')).trim(),fonte:String(d.get('fonte')).trim(),miniatura:'',original:''};
 if(!p.titulo)return;
 const drafts=readDrafts();
 drafts.push(p);
 if(!saveDrafts(drafts)){status.textContent='Não foi possível salvar neste navegador. Nenhum registro foi enviado.';return}
 form.reset();
 status.textContent='Cadastro de teste salvo neste navegador. Ainda não foi publicado no acervo central.';
});
</script></body></html>
